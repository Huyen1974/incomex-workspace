<body class="mot" data-region="mot.app">

    <div class="main" data-region="mot.main">
      <div class="main-inner" id="main-inner" data-region="mot.main.content"></div>
    </div>
  </div>

  <div class="toast" id="toast" data-region="mot.toast"></div>
