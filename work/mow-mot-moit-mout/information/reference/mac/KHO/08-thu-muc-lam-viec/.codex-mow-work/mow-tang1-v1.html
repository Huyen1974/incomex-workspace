<!doctype html>
<!--
  MẪU THẨM MỸ THAM KHẢO — KHÔNG PHẢI NGUỒN NHÂN BẢN TASK.
  File này giữ hình dáng thẻ và móc treo đã được Owner duyệt.

  Muốn tạo task T1 mới:
  - KHÔNG copy file này.
  - Chỉ thêm dữ liệu qua MOW_T1_WORK_STANDARD_V1.
  - Nguồn chuẩn: ./mow-t1-work-standard-v1.js
  - Hướng dẫn: ./MOW_T1_WORK_STANDARD_v1.md

  Nếu sửa hình dáng tại đây, thay đổi KHÔNG tự đi vào production.
  Thay đổi production phải sửa nguồn chuẩn, audit đủ trạng thái và snapshot Git.
-->
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOW T1 · Mẫu thẻ treo</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
      background: #eef1f4;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 48px 20px;
      background:
        radial-gradient(circle at 50% 20%, #fff 0%, #f6f7f9 48%, #eef1f4 100%);
      color: #101828;
      font-family:
        Inter, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Arial, sans-serif;
    }

    .hanging-cards {
      --card-width: 720px;
      --card-radius: 28px;
      --card-padding-x: 48px;
      --card-padding-y: 40px;
      --connector-gap: 42px;
      --connector-inset: 28px;
      --accent-color: #53c269;
      --title-color: #111827;
      --text-color: #505a6c;
      width: min(var(--card-width), 100%);
      margin-inline: auto;
    }

    .hanging-cards__card {
      position: relative;
      min-height: 300px;
      padding: var(--card-padding-y) var(--card-padding-x);
      background:
        linear-gradient(
          180deg,
          rgba(255, 255, 255, 1) 0%,
          rgba(255, 255, 255, 0.985) 100%
        );
      border: 1px solid rgba(16, 24, 40, 0.035);
      border-radius: var(--card-radius);
      box-shadow:
        0 24px 45px rgba(16, 24, 40, 0.09),
        0 4px 10px rgba(16, 24, 40, 0.035);
      z-index: 1;
    }

    .hanging-cards__status {
      width: 21px;
      height: 21px;
      margin-bottom: 30px;
      border-radius: 50%;
      background: var(--accent-color);
      box-shadow:
        inset 0 -2px 3px rgba(0, 0, 0, 0.06),
        0 1px 2px rgba(0, 0, 0, 0.05);
    }

    .hanging-cards__title {
      margin: 0 0 34px;
      color: var(--title-color);
      font-size: clamp(30px, 4vw, 38px);
      font-weight: 760;
      line-height: 1.15;
      letter-spacing: -0.035em;
    }

    .hanging-cards__list {
      display: grid;
      gap: 31px;
      margin: 0;
      padding: 0 0 0 22px;
      list-style: none;
    }

    .hanging-cards__item {
      display: grid;
      grid-template-columns: 20px minmax(0, 1fr);
      column-gap: 68px;
      align-items: center;
      color: var(--text-color);
      font-size: clamp(22px, 3vw, 30px);
      font-weight: 400;
      line-height: 1.3;
    }

    .hanging-cards__item::before {
      content: "";
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--accent-color);
      box-shadow:
        inset 0 -2px 3px rgba(0, 0, 0, 0.06),
        0 1px 2px rgba(0, 0, 0, 0.04);
    }

    .hanging-cards__bridge {
      position: relative;
      height: var(--connector-gap);
      z-index: 3;
      pointer-events: none;
    }

    .hanging-cards__connector {
      position: absolute;
      top: calc(var(--connector-inset) * -1);
      bottom: calc(var(--connector-inset) * -1);
      width: 28px;
      transform: translateX(-50%);
    }

    .hanging-cards__connector--left {
      left: 24%;
    }

    .hanging-cards__connector--right {
      left: 76%;
    }

    .hanging-cards__connector-art {
      display: block;
      width: 100%;
      height: 100%;
      overflow: visible;
      opacity: 0.96;
      filter: drop-shadow(0 1px 1px rgba(77, 56, 20, 0.08));
    }

    @media (max-width: 640px) {
      body {
        padding: 28px 14px;
      }

      .hanging-cards {
        --card-radius: 22px;
        --card-padding-x: 28px;
        --card-padding-y: 30px;
        --connector-gap: 36px;
        --connector-inset: 25px;
      }

      .hanging-cards__card {
        min-height: 260px;
      }

      .hanging-cards__title {
        margin-bottom: 29px;
      }

      .hanging-cards__list {
        gap: 25px;
        padding-left: 5px;
      }

      .hanging-cards__item {
        grid-template-columns: 18px minmax(0, 1fr);
        column-gap: 34px;
      }

      .hanging-cards__item::before {
        width: 18px;
        height: 18px;
      }

      .hanging-cards__connector--left {
        left: 25%;
      }

      .hanging-cards__connector--right {
        left: 75%;
      }
    }
  </style>
</head>
<body data-region="mow.t1.hanging.page">
  <main id="workflow-cards" data-region="mow.t1.hanging.host"></main>

  <script>
    (() => {
      "use strict";

      let connectorSerial = 0;

      function createCard(cardData, position) {
        const card = document.createElement("article");
        card.className = "hanging-cards__card";
        card.dataset.region = `mow.t1.hanging.card.${position}`;

        const status = document.createElement("div");
        status.className = "hanging-cards__status";
        status.dataset.region = `mow.t1.hanging.card.${position}.status`;
        status.setAttribute("aria-hidden", "true");

        const title = document.createElement("h2");
        title.className = "hanging-cards__title";
        title.dataset.region = `mow.t1.hanging.card.${position}.title`;
        title.textContent = cardData.title;

        const list = document.createElement("ul");
        list.className = "hanging-cards__list";
        list.dataset.region = `mow.t1.hanging.card.${position}.items`;

        cardData.items.forEach((itemText) => {
          const item = document.createElement("li");
          item.className = "hanging-cards__item";
          item.dataset.region = `mow.t1.hanging.card.${position}.item`;
          item.textContent = itemText;
          list.appendChild(item);
        });

        card.append(status, title, list);
        return card;
      }

      function createConnector(position) {
        const connector = document.createElement("div");
        connector.className =
          "hanging-cards__connector " +
          `hanging-cards__connector--${position}`;

        const id = `hanging-connector-${++connectorSerial}`;
        const svg = document.createElementNS(
          "http://www.w3.org/2000/svg",
          "svg"
        );
        svg.classList.add("hanging-cards__connector-art");
        svg.setAttribute("viewBox", "0 0 28 104");
        svg.setAttribute("preserveAspectRatio", "none");
        svg.setAttribute("focusable", "false");
        svg.setAttribute("aria-hidden", "true");

        svg.innerHTML = `
          <defs>
            <radialGradient id="${id}-bezel" cx="42%" cy="35%" r="66%">
              <stop offset="0" stop-color="#ffffff"/>
              <stop offset=".48" stop-color="#f7f7f5"/>
              <stop offset=".72" stop-color="#dedfdd"/>
              <stop offset=".9" stop-color="#f8f8f6"/>
              <stop offset="1" stop-color="#bfc1bf"/>
            </radialGradient>
            <radialGradient id="${id}-hole" cx="45%" cy="42%" r="62%">
              <stop offset="0" stop-color="#4b3010"/>
              <stop offset=".52" stop-color="#785018"/>
              <stop offset=".73" stop-color="#b37b20"/>
              <stop offset=".9" stop-color="#efd275"/>
              <stop offset="1" stop-color="#8c5a13"/>
            </radialGradient>
            <linearGradient id="${id}-tube" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0" stop-color="#bd8420"/>
              <stop offset=".17" stop-color="#e2ac3c"/>
              <stop offset=".36" stop-color="#ffed9d"/>
              <stop offset=".5" stop-color="#fff6c7"/>
              <stop offset=".66" stop-color="#edbe50"/>
              <stop offset=".84" stop-color="#d29829"/>
              <stop offset="1" stop-color="#9b6515"/>
            </linearGradient>
            <linearGradient id="${id}-shade" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0" stop-color="#70400a" stop-opacity="0"/>
              <stop offset=".38" stop-color="#70400a" stop-opacity=".16"/>
              <stop offset=".63" stop-color="#603609" stop-opacity=".86"/>
              <stop offset=".86" stop-color="#7b4a0c" stop-opacity=".18"/>
              <stop offset="1" stop-color="#7b4a0c" stop-opacity="0"/>
            </linearGradient>
            <filter id="${id}-soft-shadow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="1.6"/>
            </filter>
            <filter id="${id}-tube-shadow" x="-70%" y="-10%" width="240%" height="120%">
              <feGaussianBlur stdDeviation=".65"/>
            </filter>
          </defs>

          <circle
            cx="14" cy="6.5" r="12.8"
            fill="#8d9290" opacity=".24"
            filter="url(#${id}-soft-shadow)"
          />
          <circle
            cx="14" cy="97.5" r="12.8"
            fill="#8d9290" opacity=".24"
            filter="url(#${id}-soft-shadow)"
          />

          <circle cx="14" cy="6.5" r="11.2" fill="url(#${id}-bezel)"/>
          <circle cx="14" cy="97.5" r="11.2" fill="url(#${id}-bezel)"/>
          <circle cx="14" cy="6.5" r="5.15" fill="url(#${id}-hole)"/>
          <circle cx="14" cy="97.5" r="5.15" fill="url(#${id}-hole)"/>

          <path
            d="M12.8 6.5
               C12.35 28 12.4 75 13 97.5
               C13.15 100.5 14.85 100.5 15 97.5
               C15.6 75 15.65 28 15.2 6.5
               C15.05 3.5 12.95 3.5 12.8 6.5"
            fill="none"
            stroke="#72500f"
            stroke-width="5.8"
            stroke-linecap="round"
            stroke-linejoin="round"
            opacity=".06"
            filter="url(#${id}-tube-shadow)"
            transform="translate(.7 .8)"
          />
          <path
            d="M12.8 6.5 C12.35 28 12.4 75 13 97.5"
            fill="none"
            stroke="#d4a13f"
            stroke-width="2.3"
            stroke-linecap="round"
          />
          <path
            d="M15.2 6.5 C15.65 28 15.6 75 15 97.5"
            fill="none"
            stroke="url(#${id}-tube)"
            stroke-width="2.5"
            stroke-linecap="round"
          />
          <path
            d="M12.8 6.5 C12.95 3.5 15.05 3.5 15.2 6.5"
            fill="none"
            stroke="url(#${id}-tube)"
            stroke-width="2.4"
            stroke-linecap="round"
          />
          <path
            d="M13 97.5 C13.15 100.5 14.85 100.5 15 97.5"
            fill="none"
            stroke="url(#${id}-tube)"
            stroke-width="2.4"
            stroke-linecap="round"
          />
          <path
            d="M14.7 7 C15.05 28 15 75 14.5 97"
            fill="none"
            stroke="#fff5c2"
            stroke-width=".55"
            stroke-linecap="round"
            opacity=".86"
          />
          <path
            d="M12.65 39 C12.3 52 12.4 72 12.85 84"
            fill="none"
            stroke="#633b09"
            stroke-width="1.25"
            stroke-linecap="round"
            opacity=".64"
          />

          <circle
            cx="14" cy="6.5" r="11.2"
            fill="none" stroke="#c3c6c3" stroke-width=".65" opacity=".48"
          />
          <circle
            cx="14" cy="97.5" r="11.2"
            fill="none" stroke="#c3c6c3" stroke-width=".65" opacity=".48"
          />
        `;

        connector.appendChild(svg);
        return connector;
      }

      function createBridge() {
        const bridge = document.createElement("div");
        bridge.className = "hanging-cards__bridge";
        bridge.dataset.region = "mow.t1.hanging.bridge";
        bridge.setAttribute("aria-hidden", "true");
        bridge.append(createConnector("left"), createConnector("right"));
        return bridge;
      }

      function renderHangingCards(target, data) {
        const container =
          typeof target === "string" ? document.querySelector(target) : target;

        if (!container) {
          throw new Error("Không tìm thấy vị trí để hiển thị component.");
        }

        const root = document.createElement("section");
        root.className = "hanging-cards";
        root.dataset.region = "mow.t1.hanging.component";
        root.setAttribute("aria-label", "Các công việc liên kết");

        if (data.accentColor) {
          root.style.setProperty("--accent-color", data.accentColor);
        }

        root.append(
          createCard(data.top, "top"),
          createBridge(),
          createCard(data.bottom, "bottom")
        );
        container.replaceChildren(root);
        return root;
      }

      window.renderHangingCards = renderHangingCards;
      window.HangingCards = Object.freeze({ render: renderHangingCards });

      renderHangingCards("#workflow-cards", {
        top: {
          title: "Xếp nhóm",
          items: ["Phân nhóm PV", "Gửi thông báo"]
        },
        bottom: {
          title: "Chấm điểm",
          items: ["Tổng hợp kết quả", "Xuất báo cáo"]
        },
        accentColor: "#53c269"
      });
    })();
  </script>
</body>
</html>
