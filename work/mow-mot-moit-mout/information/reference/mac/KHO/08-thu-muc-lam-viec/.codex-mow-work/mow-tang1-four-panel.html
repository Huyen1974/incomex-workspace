<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOW T1 · Công việc và chi tiết</title>
  <style>
    * {
      box-sizing: border-box;
    }

    :root {
      --page-bg: #f5f6f8;
      --card-bg: #fff;
      --accent: #22c55e;
      --title: #3b82f6;
      --text: #58585b;
      --gold: rgba(190, 143, 46, 0.58);
      --gold-light: rgba(255, 235, 175, 0.82);
    }

    html,
    body {
      min-height: 100%;
    }

    body {
      margin: 0;
      padding: 20px 24px 80px;
      overflow-x: hidden;
      background: var(--page-bg);
      color: #111827;
      font-family:
        Inter, -apple-system, BlinkMacSystemFont,
        "Segoe UI", Arial, sans-serif;
    }

    .t1-page {
      width: min(1072px, 100%);
    }

    .t1-breadcrumb {
      margin: 0;
      color: #8b8b90;
      font-size: 25px;
      font-weight: 750;
      line-height: 1.2;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .t1-board {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 54px;
      margin-top: 58px;
    }

    .t1-stack {
      min-width: 0;
    }

    .t1-card {
      position: relative;
      background: var(--card-bg);
      border: 1px solid rgba(17, 24, 39, 0.025);
      border-radius: 26px;
      box-shadow:
        0 2px 3px rgba(17, 24, 39, 0.055),
        0 10px 28px rgba(17, 24, 39, 0.035);
    }

    .t1-card--work {
      min-height: 298px;
      padding: 40px 36px 34px;
    }

    .t1-card--detail {
      min-height: 192px;
      padding: 58px 36px 38px;
    }

    .t1-status {
      width: 18px;
      height: 18px;
      margin: 0 0 36px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow:
        inset 0 -1px 2px rgba(0, 0, 0, 0.06),
        0 1px 2px rgba(0, 0, 0, 0.025);
    }

    .t1-title {
      margin: 0 0 32px;
      color: var(--title);
      font-size: 32px;
      font-weight: 720;
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .t1-list {
      display: grid;
      gap: 16px;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .t1-item {
      display: grid;
      grid-template-columns: 18px minmax(0, 1fr);
      column-gap: 86px;
      align-items: center;
      color: var(--text);
      font-size: 28px;
      font-weight: 400;
      line-height: 1.35;
      white-space: nowrap;
    }

    .t1-item::before {
      content: "";
      width: 16px;
      height: 16px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow:
        inset 0 -1px 2px rgba(0, 0, 0, 0.05),
        0 1px 2px rgba(0, 0, 0, 0.025);
    }

    .t1-bridge {
      position: relative;
      height: 47px;
      z-index: 3;
      pointer-events: none;
    }

    .t1-connector {
      position: absolute;
      top: -30px;
      bottom: -30px;
      width: 24px;
      transform: translateX(-50%);
    }

    .t1-connector--left {
      left: 24%;
    }

    .t1-connector--right {
      left: 76%;
    }

    .t1-ring {
      position: absolute;
      top: 4px;
      bottom: 4px;
      left: 50%;
      width: 18px;
      transform: translateX(-50%);
      border: 2px solid var(--gold);
      border-radius: 50%;
      box-shadow:
        inset 1px 0 0 var(--gold-light),
        0 2px 3px rgba(88, 62, 13, 0.08);
      opacity: 0.94;
    }

    .t1-grommet {
      position: absolute;
      left: 50%;
      width: 11px;
      height: 11px;
      transform: translateX(-50%);
      border-radius: 50%;
      background:
        radial-gradient(
          circle at 48% 46%,
          rgba(255, 255, 255, 0.98) 0 18%,
          rgba(105, 74, 21, 0.68) 21% 31%,
          rgba(211, 172, 82, 0.66) 34% 53%,
          rgba(255, 240, 196, 0.52) 56% 70%,
          rgba(177, 139, 62, 0.26) 72% 100%
        );
      box-shadow: 0 1px 3px rgba(66, 48, 16, 0.13);
      z-index: 2;
    }

    .t1-grommet--top {
      top: 0;
    }

    .t1-grommet--bottom {
      bottom: 0;
    }

    @media (max-width: 900px) {
      .t1-page {
        width: 100%;
      }

      .t1-board {
        grid-template-columns: 1fr;
        gap: 42px;
      }
    }

    @media (max-width: 560px) {
      body {
        padding: 20px 14px 54px;
      }

      .t1-breadcrumb {
        font-size: 18px;
      }

      .t1-board {
        margin-top: 34px;
      }

      .t1-card {
        border-radius: 22px;
      }

      .t1-card--work {
        min-height: 260px;
        padding: 30px 26px;
      }

      .t1-card--detail {
        min-height: 170px;
        padding: 46px 26px 30px;
      }

      .t1-status {
        margin-bottom: 28px;
      }

      .t1-title {
        margin-bottom: 28px;
        font-size: 28px;
      }

      .t1-item {
        column-gap: 36px;
        font-size: 21px;
        white-space: normal;
      }
    }
  </style>
</head>
<body data-region="mow.t1.page">
  <main class="t1-page" data-region="mow.t1.board">
    <p class="t1-breadcrumb" data-region="mow.t1.breadcrumb">
      Công việc → Chi tiết
    </p>
    <section id="t1-board" class="t1-board" aria-label="Công việc và chi tiết"></section>
  </main>

  <script>
    (() => {
      "use strict";

      function createList(items, region) {
        const list = document.createElement("ul");
        list.className = "t1-list";
        list.dataset.region = region;

        items.forEach((text) => {
          const item = document.createElement("li");
          item.className = "t1-item";
          item.dataset.region = `${region}.item`;
          item.textContent = text;
          list.appendChild(item);
        });
        return list;
      }

      function createConnector(position) {
        const connector = document.createElement("div");
        connector.className =
          `t1-connector t1-connector--${position}`;

        const top = document.createElement("span");
        top.className = "t1-grommet t1-grommet--top";

        const ring = document.createElement("span");
        ring.className = "t1-ring";

        const bottom = document.createElement("span");
        bottom.className = "t1-grommet t1-grommet--bottom";

        connector.append(top, ring, bottom);
        return connector;
      }

      function createStack(data, index) {
        const stack = document.createElement("article");
        stack.className = "t1-stack";
        stack.dataset.region = "mow.t1.stack";

        const work = document.createElement("section");
        work.className = "t1-card t1-card--work";
        work.dataset.region = "mow.t1.work";

        const status = document.createElement("div");
        status.className = "t1-status";
        status.dataset.region = "mow.t1.work.status";
        status.setAttribute("aria-hidden", "true");

        const title = document.createElement("h2");
        title.className = "t1-title";
        title.dataset.region = "mow.t1.work.title";
        title.textContent = data.title;

        work.append(
          status,
          title,
          createList(data.items, "mow.t1.work.items")
        );

        const bridge = document.createElement("div");
        bridge.className = "t1-bridge";
        bridge.dataset.region = "mow.t1.bridge";
        bridge.setAttribute("aria-hidden", "true");
        bridge.append(
          createConnector("left"),
          createConnector("right")
        );

        const detail = document.createElement("section");
        detail.className = "t1-card t1-card--detail";
        detail.dataset.region = "mow.t1.detail";
        detail.setAttribute("aria-label", `Chi tiết ${data.title}`);
        detail.append(
          createList(data.details || data.items, "mow.t1.detail.items")
        );

        stack.dataset.stack = String(index + 1);
        stack.append(work, bridge, detail);
        return stack;
      }

      function renderMowT1Cards(target, stacks) {
        const host =
          typeof target === "string" ? document.querySelector(target) : target;

        if (!host) {
          throw new Error("Không tìm thấy vị trí hiển thị MOW T1.");
        }

        host.replaceChildren(
          ...stacks.map((stack, index) => createStack(stack, index))
        );
        return host;
      }

      window.renderMowT1Cards = renderMowT1Cards;

      renderMowT1Cards("#t1-board", [
        {
          title: "Nhận đơn",
          items: ["Form tiếp nhận", "Webhook trigger"]
        },
        {
          title: "Nhập hệ thống",
          items: ["Record PG", "Lark Base sync"]
        }
      ]);
    })();
  </script>
</body>
</html>
